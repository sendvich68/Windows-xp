<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Windows XP · Планшет</title>
<style>
  * { box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; font-family:'Tahoma', 'Segoe UI', sans-serif; }
  html, body { touch-action:manipulation; }
  body { margin:0; min-height:100vh; background:#000; display:flex; align-items:center;
    justify-content:center; padding:12px; font-size:11px; overflow:hidden; }

  .tablet { width:1024px; max-width:100%; height:100vh; max-height:720px;
    background:#1a1a1a; border-radius:20px; padding:12px; position:relative;
    box-shadow:0 20px 40px rgba(0,0,0,.8), inset 0 0 0 3px #444;
    display:flex; flex-direction:column; overflow:hidden; }

  .screen { position:relative; flex:1; border-radius:4px; overflow:hidden;
    background:#3A6EA5; background-image:url('assets/обои1.png');
    background-size:cover; background-position:center;
    box-shadow:inset 0 0 0 2px #000; cursor:none; touch-action:none; min-height:0; }

  .cursor-img { position:absolute; width:26px; height:26px; pointer-events:none; z-index:999999;
    image-rendering:pixelated; }

  .desktop { position:absolute; inset:0 0 32px 0; padding:8px; overflow:hidden; pointer-events:none; }

  .grid-overlay { position:absolute; inset:0 0 32px 0; pointer-events:none; z-index:50; display:none; }
  .grid-overlay.active { display:block; }
  .grid-cell { position:absolute; width:76px; height:80px;
    border:1px dashed rgba(255,255,255,.25); border-radius:4px; }

  .icon { position:absolute; width:76px; display:flex; flex-direction:column; align-items:center;
    gap:2px; padding:4px 2px; color:#fff; cursor:pointer; font-size:11px;
    text-align:center; word-break:break-word; text-shadow:1px 1px 1px #000;
    pointer-events:auto; z-index:10; }
  .icon.hover { background:#0A246A; outline:1px dotted #fff; }
  .icon.selected { background:#0A246A; outline:2px solid #fff; }
  .icon.dragging { opacity:0.7; z-index:99999 !important; outline:1px dashed #fff; background:#0A246A; }
  .icon .ico { width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    font-size:30px; pointer-events:none; }
  .icon .ico img { width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .icon .lbl { pointer-events:none; }

  .window { position:absolute; background:#ECE9D8; border:1px solid #0054E3;
    border-radius:7px 7px 0 0; box-shadow:2px 2px 8px #0008;
    display:flex; flex-direction:column; overflow:hidden; z-index:100;
    font-family:'Tahoma', sans-serif; }
  .win-title { padding:3px 4px 3px 6px; height:22px;
    background:linear-gradient(180deg, #0058EE 0%, #3A93FF 8%, #0054E3 40%, #0048CC 88%, #003CBB 100%);
    color:#fff; font-size:11px; font-weight:bold;
    display:flex; justify-content:space-between; align-items:center;
    text-shadow:1px 1px 0 #003; border-radius:6px 6px 0 0; }
  .win-title .wt-icon { display:flex; align-items:center; gap:5px; }
  .win-title .wt-icon img { width:16px; height:16px; }
  .win-controls { display:flex; gap:2px; }
  .win-btn { width:21px; height:19px; background:#ECE9D8;
    border:1px solid #fff; border-right-color:#808080; border-bottom-color:#808080;
    box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
    color:#000; font-size:11px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; cursor:pointer; font-family:'Tahoma', sans-serif; }
  .win-btn:hover, .win-btn.hover { background:#D0D0D0; }
  .win-btn.close { background:#E8A8A8; }
  .win-btn.close:hover, .win-btn.close.hover { background:#E88A8A; }
  .win-body { padding:4px; font-size:11px; flex:1; overflow:auto;
    background:#ECE9D8; margin:0; border:2px inset #ECE9D8; }

  .window.maximized { left:0 !important; top:0 !important; width:100% !important;
    height:calc(100% - 32px) !important; border-radius:0 !important; z-index:9998 !important; }

  .taskbar { position:absolute; bottom:0; left:0; right:0; height:32px;
    background:linear-gradient(180deg, #245EDC 0%, #3A6EE0 8%, #2851D8 40%, #2356D9 88%, #1E45B8 100%);
    border-top:2px solid #4A6EE0; z-index:900;
    display:flex; align-items:center; padding:0 2px; gap:2px; }
  .taskbar-start { height:24px; padding:0 10px 0 6px;
    background:linear-gradient(180deg, #3AAE4E 0%, #2C9C3E 100%);
    border:1px solid #1A5F2A; border-radius:0 8px 8px 0;
    display:flex; align-items:center; gap:4px;
    color:#fff; font-weight:bold; font-size:12px; font-style:italic;
    text-shadow:1px 1px 0 #0A3010; cursor:pointer; pointer-events:auto; }
  .taskbar-start:hover { background:linear-gradient(180deg, #4ABE5E 0%, #3CAC4E 100%); }
  .taskbar-start svg { width:16px; height:16px; }

  .taskbar-divider { width:2px; height:24px;
    background:linear-gradient(180deg, transparent 0%, #4A6EE0 20%, #1E45B8 80%, transparent 100%);
    margin:0 4px; }

  .taskbar-pin { height:24px; min-width:24px; padding:0 6px;
    background:#3A6EE0; border:1px solid #2356D9;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; pointer-events:auto; }
  .taskbar-pin:hover { background:#4A7EE8; }
  .taskbar-pin img { width:18px; height:18px; object-fit:contain; }

  .taskbar-windows { display:flex; gap:2px; flex:1; overflow:hidden; }
  .taskbar-item { height:22px; padding:0 8px; background:#3A6EE0;
    border:1px solid #2356D9; display:flex; align-items:center; gap:4px;
    color:#fff; font-size:11px; cursor:pointer; pointer-events:auto;
    max-width:160px; overflow:hidden; white-space:nowrap; }
  .taskbar-item:hover { background:#4A7EE8; }
  .taskbar-item.active { background:#1E45B8; }
  .taskbar-item img { width:14px; height:14px; }

  .taskbar-tray { height:22px; padding:0 8px;
    background:linear-gradient(180deg, #1E45B8 0%, #2B5BD8 30%, #3A6EE0 100%);
    border:1px solid #2356D9; display:flex; align-items:center; gap:6px;
    color:#fff; font-size:11px; }

  .lang-btn { height:22px; padding:0 8px;
    background:linear-gradient(180deg, #3A6EE0 0%, #2356D9 100%);
    border:1px solid #2356D9; display:flex; align-items:center; gap:4px;
    color:#fff; font-size:11px; font-weight:bold; cursor:pointer; pointer-events:auto;
    font-family:'Tahoma', sans-serif; }
  .lang-btn:hover, .lang-btn.hover { background:linear-gradient(180deg, #4A7EE8 0%, #3A6EE0 100%); }
  .lang-btn .flag { font-size:14px; }

  .start-menu { position:absolute; bottom:32px; left:0; width:380px;
    background:#ECE9D8; border:1px solid #0054E3;
    display:none; flex-direction:column; z-index:950; box-shadow:2px -2px 8px #0008; }
  .start-menu.open { display:flex; }
  .start-header { height:56px; background:linear-gradient(180deg, #0058EE 0%, #3A93FF 8%, #0054E3 40%, #0048CC 88%, #003CBB 100%);
    color:#fff; display:flex; align-items:center; gap:8px; padding:0 10px;
    font-size:14px; font-weight:bold; font-style:italic;
    text-shadow:1px 1px 2px #000; }
  .start-header .avatar { width:40px; height:40px; border-radius:4px;
    background:#ECE9D8; display:flex; align-items:center; justify-content:center;
    border:2px solid #fff; font-size:24px; }
  .start-body { display:flex; padding:4px; min-height:300px; }
  .start-left { width:180px; background:#fff; border:1px solid #808080; padding:4px 0; overflow-y:auto; max-height:400px; }
  .start-right { width:180px; background:#D3E5FA; border:1px solid #808080; border-left:none; padding:4px 0; overflow-y:auto; max-height:400px; }
  .start-item { display:flex; align-items:center; gap:8px; padding:4px 8px;
    cursor:pointer; pointer-events:auto; color:#000; font-size:11px; }
  .start-item:hover, .start-item.hover { background:#0A246A; color:#fff; }
  .start-item .si-ico { width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
  .start-item .si-ico img { width:24px; height:24px; object-fit:contain; }
  .start-footer { height:32px; background:linear-gradient(180deg, #3A6EE0 0%, #2356D9 100%);
    display:flex; justify-content:flex-end; align-items:center; gap:6px; padding:0 8px; }
  .start-footer button { background:#ECE9D8; border:1px solid #808080;
    padding:3px 8px; font-size:11px; cursor:pointer; pointer-events:auto;
    display:flex; align-items:center; gap:4px; font-family:'Tahoma', sans-serif; }
  .start-footer button:hover, .start-footer button.hover { background:#D0D0D0; }

  .xp-btn { background:#ECE9D8; border:1px solid #003C74;
    padding:3px 12px; font-size:11px; font-family:'Tahoma', sans-serif;
    cursor:pointer; pointer-events:auto; box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080; }
  .xp-btn:hover, .xp-btn.hover { background:#D0D0D0; }
  .xp-btn:active { box-shadow:inset 1px 1px 0 #808080, inset -1px -1px 0 #fff; }

  .xp-toolbar { background:#ECE9D8; border-bottom:1px solid #808080;
    padding:2px; display:flex; gap:2px; align-items:center; }
  .xp-toolbar button { background:transparent; border:1px solid transparent;
    padding:3px 6px; font-size:11px; cursor:pointer; pointer-events:auto;
    font-family:'Tahoma', sans-serif; display:flex; align-items:center; gap:3px; }
  .xp-toolbar button:hover, .xp-toolbar button.hover {
    background:#ECE9D8; border:1px solid #808080;
    box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080; }

  .xp-explorer { display:flex; height:100%; background:#fff; }
  .xp-explorer-left { width:160px; background:#D3E5FA; border-right:1px solid #808080;
    padding:8px 4px; font-size:11px; }
  .xp-explorer-left .xp-section { margin-bottom:12px; }
  .xp-explorer-left .xp-section h4 { margin:0 0 4px; color:#215DC6;
    font-size:11px; font-weight:bold; padding:2px 4px;
    background:linear-gradient(90deg, #fff 0%, #D3E5FA 100%); }
  .xp-explorer-left .xp-section ul { list-style:none; margin:0; padding:0 0 0 8px; }
  .xp-explorer-left .xp-section li { padding:2px 4px; cursor:pointer; display:flex; gap:4px; align-items:center; }
  .xp-explorer-left .xp-section li:hover { background:#0A246A; color:#fff; }
  .xp-explorer-main { flex:1; background:#fff; padding:4px; overflow:auto;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(80px,1fr));
    gap:4px; align-content:flex-start; }
  .xp-file { display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:4px; font-size:11px; cursor:pointer; text-align:center;
    border:1px solid transparent; }
  .xp-file:hover { background:#E0E8F8; border:1px dotted #215DC6; }
  .xp-file .xf-ico { font-size:32px; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; }
  .xp-file .xf-ico img { width:100%; height:100%; object-fit:contain; }
  .xp-status { height:20px; background:#ECE9D8; border-top:1px solid #808080;
    padding:2px 8px; font-size:11px; display:flex; align-items:center; }

  .notepad { width:100%; height:100%; resize:none; border:none;
    padding:2px; font-family:'Courier New', monospace; font-size:12px;
    background:#fff; outline:none; }

  .calc-xp { background:#ECE9D8; padding:6px; display:flex; flex-direction:column; height:100%; }
  .calc-display { background:#fff; border:2px inset #ECE9D8; padding:4px 8px;
    text-align:right; font-size:18px; margin-bottom:6px; font-family:'Courier New', monospace;
    min-height:30px; overflow:hidden; }
  .calc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; flex:1; }
  .calc-grid button { padding:8px 0; font-size:13px; border:1px solid #003C74;
    background:#ECE9D8; cursor:pointer; font-weight:bold;
    box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
    pointer-events:auto; font-family:'Tahoma', sans-serif; }
  .calc-grid button.hover { background:#D0D0D0; }
  .calc-grid button.op { color:#C00000; }
  .calc-grid button.eq { color:#0000C0; }

  .terminal { background:#000; color:#c0c0c0; font-family:'Courier New', monospace;
    font-size:12px; padding:4px; height:100%; overflow-y:auto; outline:none; border:none; }
  .terminal .line { white-space:pre-wrap; }
  .terminal .prompt { color:#00ff00; }
  .terminal .error { color:#ff5555; }
  .terminal .info { color:#55aaff; }
  .terminal input { background:transparent; border:none; color:#c0c0c0;
    font-family:'Courier New', monospace; font-size:12px; width:calc(100% - 40px); outline:none; }

  .game-dev { display:flex; flex-direction:column; height:100%; background:#ECE9D8; }
  .game-tabs { display:flex; background:#ECE9D8; border-bottom:1px solid #808080; gap:1px; padding:2px 2px 0; }
  .game-tab { padding:4px 12px; background:#D3E5FA; border:1px solid #808080; border-bottom:none;
    font-size:11px; cursor:pointer; pointer-events:auto; border-radius:3px 3px 0 0; }
  .game-tab.active { background:#ECE9D8; font-weight:bold; }
  .game-tab:hover, .game-tab.hover { background:#E0E8F8; }
  .game-panel { display:none; flex:1; overflow:auto; padding:4px; }
  .game-panel.active { display:flex; flex-direction:column; }
  .game-editor { width:100%; height:100%; border:2px inset #ECE9D8;
    font-family:'Consolas', 'Courier New', monospace; font-size:12px; resize:none; outline:none; padding:4px; }
  .game-toolbar { padding:4px; background:#ECE9D8; border-bottom:1px solid #808080;
    display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .preview-frame { flex:1; border:2px inset #ECE9D8; background:#fff; }
  .preview-frame iframe { width:100%; height:100%; border:none; }

  .pc-browser { display:flex; flex-direction:column; height:100%; background:#fff; }
  .pc-toolbar { background:#ECE9D8; border-bottom:1px solid #808080;
    padding:3px; display:flex; gap:3px; align-items:center; }
  .pc-toolbar button { background:#ECE9D8; border:1px solid #003C74;
    padding:3px 6px; border-radius:2px; font-size:11px; cursor:pointer;
    box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
    pointer-events:auto; font-family:'Tahoma', sans-serif; }
  .pc-toolbar button:hover, .pc-toolbar button.hover { background:#D0D0D0; }
  .pc-address { flex:1; background:#fff; border:2px inset #ECE9D8; padding:2px 6px;
    display:flex; align-items:center; gap:4px; font-size:11px; }
  .pc-address input { flex:1; border:none; outline:none; font-size:11px;
    background:transparent; font-family:'Tahoma', sans-serif; }
  .pc-content { flex:1; position:relative; background:#fff; overflow:hidden; }
  .pc-content iframe { width:100%; height:100%; border:none; }
  .pc-home { display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:40px 20px; text-align:center;
    background:#ECE9D8; height:100%; }
  .pc-home-logo { font-size:56px; font-weight:bold;
    font-family:'Times New Roman', serif; margin-bottom:20px; }
  .pc-home-logo span:nth-child(1) { color:#0055EA; }
  .pc-home-logo span:nth-child(2) { color:#FF0000; }
  .pc-home-logo span:nth-child(3) { color:#FFCC00; }
  .pc-home-logo span:nth-child(4) { color:#0055EA; }
  .pc-home-logo span:nth-child(5) { color:#00AA00; }
  .pc-home-logo span:nth-child(6) { color:#FF0000; }
  .pc-home-search { display:flex; gap:4px; margin-bottom:20px; width:100%; max-width:400px; }
  .pc-home-search input { flex:1; padding:4px 8px; border:2px inset #ECE9D8;
    font-size:12px; font-family:'Tahoma', sans-serif; }
  .pc-home-search button { padding:4px 12px; border:1px solid #003C74;
    background:#ECE9D8; cursor:pointer; box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
    pointer-events:auto; font-family:'Tahoma', sans-serif; }
  .pc-home-links { display:flex; gap:16px; font-size:11px; }
  .pc-home-links a { color:#0000EE; text-decoration:underline; cursor:pointer; }

  .joystick-wrap { position:absolute; bottom:48px; left:16px; z-index:700;
    display:flex; align-items:flex-end; gap:12px; pointer-events:none; }
  .joystick { width:100px; height:100px; border-radius:50%; background:rgba(0,0,0,.5);
    border:2px solid #ffffff44; position:relative; pointer-events:auto;
    box-shadow:inset 0 0 20px #000a; touch-action:none; }
  .joystick-stick { position:absolute; left:50%; top:50%; width:44px; height:44px;
    border-radius:50%; background:radial-gradient(circle at 35% 35%,#d0d0e0,#5a5a7a);
    transform:translate(-50%,-50%); box-shadow:0 3px 10px #000a; pointer-events:none; }

  .mouse-buttons { display:flex; flex-direction:column; gap:6px; pointer-events:auto; }
  .mouse-btn { background:linear-gradient(180deg,#4a4a6a,#2a2a3e); border:2px solid #6a6a8a;
    color:#fff; padding:10px 16px; font-size:12px; font-family:'Tahoma', sans-serif;
    font-weight:bold; cursor:pointer; pointer-events:auto;
    box-shadow:0 3px 0 #1a1a2e, inset 0 1px 0 #8a8aaa; min-width:80px; text-align:center; }
  .mouse-btn:hover, .mouse-btn.hover { background:linear-gradient(180deg,#5a5a7a,#3a3a4e); }
  .mouse-btn:active { transform:translateY(3px); box-shadow:0 0 0 #1a1a2e; }
  .mouse-btn.lkm { background:linear-gradient(180deg,#2e7d32,#1e5d22); border-color:#3e9d42; }
  .mouse-btn.lkm:hover, .mouse-btn.lkm.hover { background:linear-gradient(180deg,#3ea043,#2e7d32); }
  .mouse-btn.pkm { background:linear-gradient(180deg,#c62828,#8e1d1d); border-color:#e63946; }
  .mouse-btn.pkm:hover, .mouse-btn.pkm.hover { background:linear-gradient(180deg,#e63946,#c62828); }
  .mouse-btn.skm { background:linear-gradient(180deg,#1565c0,#0d47a1); border-color:#1e88e5; }
  .mouse-btn.skm:hover, .mouse-btn.skm.hover { background:linear-gradient(180deg,#1e88e5,#1565c0); }

  .kb-block { position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
    background:#2d2d2d; border-radius:10px; padding:4px 6px 5px;
    box-shadow:inset 0 0 0 2px #444, 0 6px 20px rgba(0,0,0,0.6);
    z-index:2000; width:680px; max-width:calc(100vw - 24px); user-select:none; }
  .kb-block.hidden { display:none; }
  .kb-header { display:flex; justify-content:space-between; align-items:center;
    padding:0 4px 3px; color:#aaa; font-size:10px; cursor:grab; }
  .kb-header:active { cursor:grabbing; }
  .kb-header .kb-title { display:flex; align-items:center; gap:6px; }
  .kb-header .drag-handle { display:inline-block; width:14px; height:14px;
    background:repeating-linear-gradient(45deg, #888 0px, #888 2px, transparent 2px, transparent 4px);
    border-radius:2px; }
  .kb-toggle { background:#3a3a3a; color:#fff; border:1px solid #555;
    padding:1px 8px; border-radius:8px; font-size:10px; cursor:pointer; pointer-events:auto; }
  .kb-toggle.hover { background:#555; }
  .keyboard { display:flex; flex-direction:column; gap:1px; }
  .kb-row { display:flex; gap:1px; justify-content:center; }
  .kb-key { background:#3c3c5a; color:#fff; border:none; border-radius:3px;
    padding:3px 0; min-width:18px; flex:1; font-size:9px; font-weight:600;
    box-shadow:0 1px 0 #1a1a2e; cursor:pointer; pointer-events:auto; transition:background 0.05s; }
  .kb-key:active { background:#5a6a9a; transform:translateY(1px); }
  .kb-key.hover { background:#5a6a9a; }
  .kb-key.wide { flex:2; }
  .kb-key.space { flex:8; }
  .kb-key.fn { background:#252536; font-size:8px; flex:0 0 auto; min-width:22px; padding:2px 1px; }
  .kb-key.mod { background:#2d2d44; font-size:8px; }

  .hud { position:absolute; top:8px; left:8px; background:#000c; color:#fff;
    padding:6px 12px; border-radius:16px; font-weight:700; z-index:600;
    font-size:14px; display:none; pointer-events:none; }
  .hud.show { display:block; }

  .shutdown-screen { position:absolute; inset:0; background:#000; z-index:99998;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; font-size:16px; gap:12px; pointer-events:auto; }
  .spinner { width:40px; height:40px; border:3px solid #333; border-top-color:#fff;
    border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .errwin { position:absolute; width:300px; background:#ECE9D8;
    border:1px solid #0054E3; z-index:850; box-shadow:2px 2px 8px #0008; pointer-events:auto; }
  .errwin .eh { padding:3px 6px; background:linear-gradient(180deg, #0058EE, #0048CC);
    color:#fff; font-weight:bold; font-size:11px; }
  .errwin .eb { padding:16px; font-size:11px; display:flex; gap:12px; align-items:center; }
  .errwin .eb .eic { font-size:32px; }
  .errwin .ef { padding:6px; text-align:center; background:#ECE9D8; border-top:1px solid #808080; }
  .errwin button { padding:3px 20px; border:1px solid #003C74; background:#ECE9D8;
    box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
    font-family:'Tahoma', sans-serif; cursor:pointer; pointer-events:auto; font-size:11px; }

  .icon-context-menu { font-family:'Tahoma', sans-serif; }

  /* Снейк */
  .snake-canvas { display:block; margin:0 auto; background:#1a1a1a; border:2px inset #ECE9D8; }

  /* Ransom */
  .ransom-video-layer { position:absolute; inset:0; z-index:50000; background:#000; pointer-events:none; }
  .ransom-video-layer video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.15); pointer-events:none; }
  .thank-video-layer { position:absolute; inset:0; z-index:90000; background:#000; pointer-events:none; }
  .thank-video-layer video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }

  .coin { position:absolute; width:32px; height:32px; z-index:55000;
    filter:drop-shadow(0 3px 5px #000a); animation:coinBob .8s ease-in-out infinite alternate;
    pointer-events:auto; }
  .coin.hover { filter:drop-shadow(0 0 10px #ffd700); }
  .coin img { width:100%; height:100%; object-fit:contain; }
  .coin .fallback { width:32px; height:32px; border-radius:50%;

    border:2px solid #8a6d00; display:flex; align-items:center; justify-content:center; font-size:18px; }
  @keyframes coinBob { from{transform:translateY(0);} to{transform:translateY(-5px);} }

  @media (max-width:700px) {

    .kb-block { width:calc(100vw - 12px); }
    .kb-key { padding:2px 0; font-size:8px; min-width:14px; }
  }

<script>
(function() {
  // ===== ЛОКАЛИЗАЦИЯ =====
  const translations = {
    ru: {
      start: 'пуск', user: 'Пользователь', logoff: 'Выход', shutdown: 'Выключить',
      create: 'Создать', keyboard: '⌨ Клавиатура', hide: 'Скрыть', show: 'Показать клавиатуру',
      apps: {

        notepad: 'Блокнот', calc: 'Калькулятор', browser: 'Google XP',

      },
      menu: { myDocs: 'Мои документы', myComputer: 'Мой компьютер', createSite: 'Создать сайт',
        createGame: 'Создать игру', saveNow: 'Сохранить сейчас', controlPanel: 'Панель управления' },
      trash: { empty: 'Корзина пуста', clear: 'Очистить корзину', restore: 'Восстановить всё',
        confirmClear: 'Очистить корзину?', confirmRestore: 'Восстановить' },
      explorer: { newFile: 'Создать файл', newSite: 'Создать сайт', newFolder: 'Создать папку',
        otherPlaces: 'Другие места', desktop: 'Рабочий стол', docs: 'Документы',
        pics: 'Изображения', music: 'Музыка', downloads: 'Загрузки',
        myComputer: 'Мой компьютер', localDisk: 'Локальный диск (C:)', diskD: 'Диск (D:)',
        diskE: 'Диск (E:)', dvd: 'DVD-диск (F:)', trash: 'Корзина', ready: 'Готово', emptyFolder: 'Пусто' },
      system: { noSave: 'Не удалось сохранить', saved: 'Данные сохранены',
        whatsNew: 'ЧТО_НОВОГО.txt', confirmDelete: 'Удалить', toTrash: 'в корзину?',
        restoreItem: 'Восстановить', siteCreated: 'Сайт создан!', gameSaved: 'Игра сохранена',
        programCreated: 'Программа создана!', fileCreated: 'Файл создан',
        logoutDone: 'Выход из системы выполнен', welcome: 'Добро пожаловать',
        ransomDenied: 'Отказано в доступе! Ransom нельзя удалить.' },
      dialog: { createWhat: 'Что создать?', app: 'Приложение (иконка)', program: 'HTML/JS программа',
        site: 'Сайт', name: 'Название', emoji: 'Эмодзи', htmlCode: 'HTML/JS код',
        siteName: 'Название сайта', fileName: 'Имя файла', confirmClearAll: 'Очистить все данные?' },
      terminal: { help: 'Команды: help, dir, echo, cls, ver, date, exit, sites, save, clear',
        noSites: 'Нет созданных сайтов', saved: 'Данные сохранены в localStorage',
        version: 'Windows 34 v2.2 [Build 2026]',
        notCommand: 'не является внутренней или внешней командой' }
    },
    en: {
      start: 'start', user: 'User', logoff: 'Log off', shutdown: 'Shut down',
      create: 'Create', keyboard: '⌨ Keyboard', hide: 'Hide', show: 'Show keyboard',
      apps: {
        computer: 'My Computer', explorer: 'Explorer', disk: 'Disk C:',
        notepad: 'Notepad', calc: 'Calculator', browser: 'Google XP',
        google_pc: 'Google PC', terminal: 'Terminal', firefox: 'Firefox',
        gamedev: 'HTML Games', play: 'Play', wallpaper: 'Wallpaper', trash: 'Recycle Bin'
      },
      menu: { myDocs: 'My Documents', myComputer: 'My Computer', createSite: 'Create website',
        createGame: 'Create game', saveNow: 'Save now', controlPanel: 'Control Panel' },
      trash: { empty: 'Recycle Bin is empty', clear: 'Empty Recycle Bin', restore: 'Restore all',
        confirmClear: 'Empty Recycle Bin?', confirmRestore: 'Restore' },
      explorer: { newFile: 'New file', newSite: 'New website', newFolder: 'New folder',
        otherPlaces: 'Other places', desktop: 'Desktop', docs: 'Documents',
        pics: 'Pictures', music: 'Music', downloads: 'Downloads',
        myComputer: 'My Computer', localDisk: 'Local Disk (C:)', diskD: 'Disk (D:)',
        diskE: 'Disk (E:)', dvd: 'DVD Drive (F:)', trash: 'Recycle Bin', ready: 'Ready', emptyFolder: 'Empty' },
      system: { noSave: 'Failed to save', saved: 'Data saved',
        whatsNew: 'WHATS_NEW.txt', confirmDelete: 'Delete', toTrash: 'to Recycle Bin?',
        restoreItem: 'Restore', siteCreated: 'Website created!', gameSaved: 'Game saved',
        programCreated: 'Program created!', fileCreated: 'File created',
        logoutDone: 'Logged off', welcome: 'Welcome',
        ransomDenied: 'Access denied! Ransom cannot be deleted.' },
      dialog: { createWhat: 'What to create?', app: 'Application (icon)', program: 'HTML/JS program',
        site: 'Website', name: 'Name', emoji: 'Emoji', htmlCode: 'HTML/JS code',
        siteName: 'Site name', fileName: 'File name', confirmClearAll: 'Clear all data?' },
      terminal: { help: 'Commands: help, dir, echo, cls, ver, date, exit, sites, save, clear',
        noSites: 'No websites created', saved: 'Data saved to localStorage',
        version: 'Windows 34 v2.2 [Build 2026]',
        notCommand: 'is not recognized as an internal or external command' }
    }
  };

  let currentLang = localStorage.getItem('windows34_lang') || 'ru';
  function t(key) {
    const parts = key.split('.');
    let val = translations[currentLang];
    for (const p of parts) {
      if (val && val[p] !== undefined) val = val[p];
      else return key;
    }
    return val;
  }
  function tObj(key) {
    const parts = key.split('.');
    let val = translations[currentLang];
    for (const p of parts) {
      if (val && val[p] !== undefined) val = val[p];
      else return null;
    }
    return val;
  }

  // ===== АУДИО =====
  const audioBoot = new Audio('assets/включение_windows.mp3');
  const audioShutdown = new Audio('assets/выключение_windows.mp3');
  audioBoot.volume = 0.4;
  audioShutdown.volume = 0.4;
  document.addEventListener('click', function playBoot() {
    if (!sessionStorage.getItem('bootPlayed')) {
      sessionStorage.setItem('bootPlayed', '1');
      audioBoot.play().catch(() => {});
    }
    document.removeEventListener('click', playBoot);
  });

  const screen  = document.getElementById('screen');
  const desktop = document.getElementById('desktop');
  const cursor  = document.getElementById('cursor');
  const hud = document.getElementById('hud');
  const coinCountEl = document.getElementById('coinCount');
  const joystick = document.getElementById('joystick');
  const stick = document.getElementById('stick');
  const keyboard = document.getElementById('keyboard');
  const kbBlock = document.getElementById('kbBlock');
  const kbToggle = document.getElementById('kbToggle');
  const kbHeader = document.getElementById('kbHeader');
  const kbShowWrap = document.getElementById('kbShowWrap');
  const kbShowBtn = document.getElementById('kbShowBtn');
  const startMenu = document.getElementById('startMenu');
  const taskbarStart = document.getElementById('taskbarStart');
  const taskbarWindows = document.getElementById('taskbarWindows');
  const gridOverlay = document.getElementById('gridOverlay');

  let activeWindow = null;

  function isInteractive(el) {
    return el.closest('.joystick, .mouse-buttons, .keyboard, .kb-block, .kb-toggle, button, input, textarea, select, .win-title, .code-editor, .game-editor, .notepad, iframe, a, .em-btn, .taskbar, .start-menu, .snake-canvas');
  }
  screen.addEventListener('touchstart', e => { if (!isInteractive(e.target)) e.preventDefault(); }, {passive:false});
  screen.addEventListener('mousedown', e => { if (!isInteractive(e.target)) e.preventDefault(); });

  function disableNativeKeyboard(input) {
    if (!input) return;
    input.setAttribute('inputmode', 'none');
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocorrect', 'off');
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('spellcheck', 'false');
    input.addEventListener('focus', (e) => {
      document.querySelectorAll('[data-focused="1"]').forEach(el => {
        if (el !== input) el.dataset.focused = '0';
      });
      input.dataset.focused = '1';
      if (input.hasAttribute('readonly')) input.removeAttribute('readonly');
    });
    input.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('[data-focused="1"]').forEach(el => {
        if (el !== input) el.dataset.focused = '0';
      });
      input.dataset.focused = '1';
      if (input.hasAttribute('readonly')) input.removeAttribute('readonly');
    });
  }

  const originalCreateElement = document.createElement.bind(document);
  document.createElement = function(tag) {
    const el = originalCreateElement(tag);
    if (tag === 'input' || tag === 'textarea') {
      setTimeout(() => disableNativeKeyboard(el), 0);
    }
    return el;
  };

  function updateClock() {
    const now = new Date();
    const t = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    document.getElementById('trayClock').textContent = t;
  }
  updateClock(); setInterval(updateClock, 10000);

  // ===== СЕТКА =====
  const GRID_X = 8;
  const GRID_Y = 8;
  const CELL_W = 80;
  const CELL_H = 85;
  const COLS = 12;
  const ROWS = 6;

  function snapToGrid(x, y) {
    const col = Math.round((x - GRID_X) / CELL_W);
    const row = Math.round((y - GRID_Y) / CELL_H);
    const clampedCol = Math.max(0, Math.min(COLS - 1, col));
    const clampedRow = Math.max(0, Math.min(ROWS - 1, row));
    return { col: clampedCol, row: clampedRow, x: GRID_X + clampedCol * CELL_W, y: GRID_Y + clampedRow * CELL_H };
  }

  function drawGrid() {
    gridOverlay.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.style.left = (GRID_X + c * CELL_W) + 'px';
        cell.style.top = (GRID_Y + r * CELL_H) + 'px';
        gridOverlay.appendChild(cell);
      }
    }
  }

  // ===== КУРСОР =====
  let mx = 200, my = 200;
  const BASE_STEP = 8;
  let hoveredEl = null;
  let hoverFrameId = null;
  let selectedIcon = null;

  function scheduleHover() {
    if (hoverFrameId) return;
    hoverFrameId = requestAnimationFrame(() => {
      hoverFrameId = null;
      updateHover();
    });
  }

  function updateCursor() {
    const r = screen.getBoundingClientRect();
    mx = Math.max(0, Math.min(mx, r.width  - 26));
    my = Math.max(0, Math.min(my, r.height - 26));
    cursor.style.left = mx + 'px';
    cursor.style.top  = my + 'px';
    scheduleHover();
  }

  function updateHover() {
    if (hoveredEl) { hoveredEl.classList.remove('hover'); hoveredEl = null; }
    if (dragState) { cursor.src = cursor.dataset.fist || cursor.dataset.normal; return; }
    cursor.src = cursor.dataset.normal || 'assets/мышь.png';
    const rect = screen.getBoundingClientRect();
    const px = rect.left + mx + 12;
    const py = rect.top  + my + 12;
    let el = document.elementFromPoint(px, py);
    if (!el || el === cursor || el === screen) return;
    const target = el.closest('.icon, button, .win-btn, .xp-file, .xp-btn, .win-title, .pc-toolbar button, .pc-home-links a, .taskbar-item, .taskbar-start, .taskbar-pin, .start-item, .game-tab, .xp-section li, .kb-key, .kb-toggle, .lang-btn, .snake-canvas');
    if (target) {
      target.classList.add('hover');
      hoveredEl = target;
      if (cursor.dataset.pointer) cursor.src = cursor.dataset.pointer;
      const win = target.closest('.window');
      if (win) activeWindow = win;
    }
  }

  cursor.dataset.normal  = 'assets/мышь.png';
  cursor.dataset.pointer = 'assets/палец.png';
  cursor.dataset.fist    = 'assets/кулачок.png';

  function moveCursor(dx, dy) {
    const wpWin = document.querySelector('.window[data-app="wallpaper"]');
    if (wpWin && !dragState) {
      if (dx > 4) { setWallpaper(wpIndex + 1); refreshWallpaperThumbs(); return; }
      if (dx < -4) { setWallpaper(wpIndex - 1); refreshWallpaperThumbs(); return; }
    }
    mx += dx; my += dy;
    if (dragState && dragState.el) {
      const newX = mx - dragState.offsetX;
      const newY = my - dragState.offsetY;
      dragState.el.style.left = Math.max(0, newX) + 'px';
      dragState.el.style.top  = Math.max(0, newY) + 'px';
    }
    updateCursor();
  }

  let joyActive = false;
  const JOY_RADIUS = 36;
  function moveStick(cx, cy) {
    const rect = joystick.getBoundingClientRect();
    const dx = cx - (rect.left + rect.width/2);
    const dy = cy - (rect.top + rect.height/2);
    const dist = Math.hypot(dx, dy);
    const k = dist > JOY_RADIUS ? JOY_RADIUS/dist : 1;
    stick.style.transform = `translate(calc(-50% + ${dx*k}px), calc(-50% + ${dy*k}px))`;
    if (dist > 10) {
      const speed = BASE_STEP * Math.min(dist / JOY_RADIUS, 1);
      moveCursor((dx/dist) * speed, (dy/dist) * speed);
    }
  }
  function resetStick() { stick.style.transform = 'translate(-50%,-50%)'; }

  joystick.addEventListener('mousedown', e => { joyActive = true; e.preventDefault(); e.stopPropagation(); moveStick(e.clientX, e.clientY); });
  joystick.addEventListener('touchstart', e => { joyActive = true; e.preventDefault(); e.stopPropagation(); const t=e.touches[0]; moveStick(t.clientX, t.clientY); }, {passive:false});
  window.addEventListener('mousemove', e => { if (joyActive) moveStick(e.clientX, e.clientY); });
  window.addEventListener('touchmove', e => { if (joyActive) { e.preventDefault(); const t=e.touches[0]; moveStick(t.clientX, t.clientY); } }, {passive:false});
  window.addEventListener('mouseup', () => { joyActive = false; resetStick(); });
  window.addEventListener('touchend', () => { joyActive = false; resetStick(); });

  // ===== ПЕРЕТАСКИВАНИЕ =====
  let dragState = null;
  let pkmHoldTimer = null;
  let pkmHoldStart = 0;
  let lastPkmClickTime = 0;
  const HOLD_DURATION = 5000;

  function startHoldTimer(el) {
    cancelHoldTimer();
    pkmHoldStart = Date.now();
    const progress = document.createElement('div');
    progress.style.cssText = `position:absolute;left:${parseInt(el.style.left)}px;top:${parseInt(el.style.top) - 6}px;width:${el.offsetWidth}px;height:4px;background:rgba(0,0,0,0.5);border-radius:2px;z-index:100000;overflow:hidden;`;
    const bar = document.createElement('div');
    bar.style.cssText = `height:100%;background:#4cc2ff;width:0%;transition:width 0.1s linear;`;
    progress.appendChild(bar);
    progress.id = 'holdProgress';
    screen.appendChild(progress);
    pkmHoldTimer = setInterval(() => {
      const elapsed = Date.now() - pkmHoldStart;
      const percent = Math.min(100, (elapsed / HOLD_DURATION) * 100);
      bar.style.width = percent + '%';
      if (elapsed >= HOLD_DURATION) {
        cancelHoldTimer();
        startDragWithFist(el);
      }
    }, 50);
  }

  function cancelHoldTimer() {
    if (pkmHoldTimer) { clearInterval(pkmHoldTimer); pkmHoldTimer = null; }
    const prog = document.getElementById('holdProgress');
    if (prog) prog.remove();
  }

  function startDragWithFist(el) {
    if (dragState) return;
    const elX = parseInt(el.style.left) || 0;
    const elY = parseInt(el.style.top) || 0;
    dragState = { el: el, offsetX: mx - elX, offsetY: my - elY };
    el.classList.add('dragging');
    cursor.src = cursor.dataset.fist || cursor.dataset.normal;
    gridOverlay.classList.add('active');
    updateHover();
  }

  function endDrag() {
    if (!dragState) return;
    const el = dragState.el;
    const id = el.dataset.appId || el.dataset.fileId || el.dataset.installedId || el.dataset.siteId;
    const snapped = snapToGrid(parseInt(el.style.left), parseInt(el.style.top));
    el.style.left = snapped.x + 'px';
    el.style.top  = snapped.y + 'px';
    if (id) {
      iconPositions[id] = { col: snapped.col, row: snapped.row, x: snapped.x, y: snapped.y };
      syncSave();
    }
    el.classList.remove('dragging');
    dragState = null;
    cursor.src = cursor.dataset.normal;
    gridOverlay.classList.remove('active');
    updateHover();
  }

  // ===== ЛКМ / ПКМ / СКМ =====
  function doLKM() {
    if (dragState) { endDrag(); return; }
    if (!hoveredEl) return;
    if (hoveredEl.classList.contains('icon')) {
      // RANSOM НЕЛЬЗЯ УДАЛИТЬ
      const app = hoveredEl._app;
      if (app && app.id === 'ransom') {
        alert('⛔ ' + t('system.ransomDenied'));
        return;
      }
      if (selectedIcon === hoveredEl) {
        selectedIcon.classList.remove('selected');
        selectedIcon = null;
        const file = hoveredEl._file;
        const inst = hoveredEl._installed;
        const site = hoveredEl._site;
        if (app) deleteIconToTrash(app);
        else if (file) deleteFile(file);
        else if (inst) deleteInstalledApp(inst);
        else if (site) deleteSite(site);
        return;
      }
      if (selectedIcon) selectedIcon.classList.remove('selected');
      selectedIcon = hoveredEl;

      if (timeSinceLast < 500 && timeSinceLast > 50) {
        cancelHoldTimer();
        const app = hoveredEl._app;
        const file = hoveredEl._file;
        const inst = hoveredEl._installed;
        const site = hoveredEl._site;
        if (app) openApp(app);
        else if (file) openFile(file);
        else if (inst) launchInstalledApp(inst);
        else if (site) openSite(site);

      }
      startHoldTimer(hoveredEl);

  function getActiveInput() {
    const el = document.activeElement;
    if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) return el;
    const focused = document.querySelector('[data-focused="1"]');
    if (focused && (focused.tagName === 'TEXTAREA' || focused.tagName === 'INPUT')) return focused;

  function typeKey(key) {
    if (key === 'F11') {
      if (activeWindow) activeWindow.classList.toggle('maximized');
      return;
    }
    if (['F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F12','Esc','Tab','Alt','Ctrl'].includes(key)) return;
    const input = getActiveInput();
    if (!input) return;
    if (input.hasAttribute('readonly')) input.removeAttribute('readonly');
    try { input.focus(); } catch(e) {}
    input.dataset.focused = '1';

    if (key === 'Backspace') {
      const s = input.selectionStart || 0;
      if (s > 0) {
        input.value = input.value.slice(0, s-1) + input.value.slice(input.selectionEnd);
        input.selectionStart = input.selectionEnd = s-1;
      }
    } else if (key === 'Enter') {
      if (input.tagName === 'TEXTAREA') {
        const s = input.selectionStart || 0;
        input.value = input.value.slice(0, s) + '\n' + input.value.slice(input.selectionEnd);
        input.selectionStart = input.selectionEnd = s+1;
      } else {
        input.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', bubbles:true}));
      }
    } else {
      const s = input.selectionStart || 0;
      input.value = input.value.slice(0, s) + key + input.value.slice(input.selectionEnd);
      input.selectionStart = input.selectionEnd = s+key.length;
    }
    input.dataset.focused = '1';
  }

      buildTrash(body, trashWin);

  function makeIconHTML(iconUrl, fallbackEmoji) {
    if (!iconUrl) return `<div class="ico">${fallbackEmoji}</div>`;
    return `<div class="ico"><img src="${iconUrl}" onerror="this.parentNode.innerHTML='${fallbackEmoji}'" alt=""></div>`;
  }

  function launchInstalledApp(app) {
    if (app.type === 'html' && app.content) {
      const win = createWindow(app.name, '🌐');
      const body = win.querySelector('.win-body');
      body.style.padding = '0';
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'width:100%;height:100%;border:none;background:#fff;';
      iframe.sandbox = 'allow-scripts allow-same-origin allow-modals allow-forms allow-popups';
      iframe.srcdoc = app.content;

  // ===== ОКНА =====
  let windowZ = 100;
  function createWindow(title, icon) {
    const win = document.createElement('div');
    win.className = 'window';
    win.style.zIndex = ++windowZ;
    win.style.left = (40 + Math.random()*80) + 'px';
    win.style.top  = (30 + Math.random()*50) + 'px';
    win.style.width = '400px';
    win.style.height = '300px';
    win.innerHTML = `
      <div class="win-title">
        <div class="wt-icon">${icon} <span>${title}</span></div>
        <div class="win-controls">
          <button class="win-btn min">_</button>
          <button class="win-btn max">□</button>
          <button class="win-btn close">✕</button>
        </div>
      </div>
      <div class="win-body"></div>`;
    const closeBtn = win.querySelector('.win-btn.close');
    const maxBtn = win.querySelector('.win-btn.max');
    const minBtn = win.querySelector('.win-btn.min');
    closeBtn.onclick = (e) => { e.stopPropagation(); win.remove(); };
    maxBtn.onclick = (e) => { e.stopPropagation(); win.classList.toggle('maximized'); };
    minBtn.onclick = (e) => { e.stopPropagation(); win.style.display = 'none'; };

    const title_bar = win.querySelector('.win-title');
    let sx, sy, ox, oy, dragging = false;
    title_bar.addEventListener('mousedown', e => {
      if (e.target.closest('button')) return;
      dragging = true; sx = e.clientX; sy = e.clientY;
      ox = win.offsetLeft; oy = win.offsetTop;
      win.style.zIndex = ++windowZ;
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      win.style.left = (ox + e.clientX - sx) + 'px';
      win.style.top  = (oy + e.clientY - sy) + 'px';
    });
    window.addEventListener('mouseup', () => dragging = false);

    screen.appendChild(win);
    activeWindow = win;
    return win;
  }

  function openApp(app) {
    const existing = document.querySelector(`.window[data-app="${app.id}"]`);
    if (existing) { existing.style.zIndex = ++windowZ; existing.style.display = 'flex'; activeWindow = existing; return; }
    const win = createWindow(app.name, app.fallback || '📦');
    win.dataset.app = app.id;
    const body = win.querySelector('.win-body');
    buildContent(app, body, win);
    addToTaskbar(win, app.name, app.fallback || '📦', app.ico);
    const observer = new MutationObserver(() => {
      if (!document.body.contains(win)) {
        const tbItem = taskbarWindows.querySelector(`[data-win-id="${win.dataset.winId}"]`);
        if (tbItem) tbItem.remove();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  let winCounter = 0;
  function addToTaskbar(win, name, fallback, ico) {
    win.dataset.winId = 'w' + (++winCounter);
    const item = document.createElement('div');
    item.className = 'taskbar-item active';
    item.dataset.winId = win.dataset.winId;
    item.innerHTML = ico ? `<img src="${ico}" onerror="this.remove()">` : `<span>${fallback}</span>`;
    item.appendChild(document.createTextNode(' ' + name));
    item.onclick = () => {
      if (win.style.display === 'none') { win.style.display = 'flex'; win.style.zIndex = ++windowZ; }
      else if (win.style.zIndex == windowZ) { win.style.display = 'none'; }
      else { win.style.zIndex = ++windowZ; }
      taskbarWindows.querySelectorAll('.taskbar-item').forEach(i => i.classList.remove('active'));
      if (win.style.display !== 'none') item.classList.add('active');
    };
    taskbarWindows.appendChild(item);
  }

  function openFile(file) {
    const existing = document.querySelector(`.window[data-file="${file.id}"]`);
    if (existing) { existing.style.zIndex = ++windowZ; existing.style.display = 'flex'; return; }
    const win = createWindow(file.name, '📄');
    win.dataset.file = file.id;
    const body = win.querySelector('.win-body');
    body.style.padding = '0';
    body.style.display = 'flex';
    body.style.flexDirection = 'column';

    if (file.name.endsWith('.html') && file.content) {
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'width:100%;height:100%;border:none;background:#fff;';
      iframe.sandbox = 'allow-scripts allow-same-origin allow-modals allow-forms allow-popups';
      iframe.srcdoc = file.content;
      body.appendChild(iframe);
    } else if (file.url && file.type === 'image') {
      body.innerHTML = `<div style="text-align:center;padding:10px;overflow:auto"><img src="${file.url}" style="max-width:100%;max-height:100%"></div>`;
    } else if (file.url && file.type === 'video') {
      body.innerHTML = `<div style="text-align:center;padding:10px"><video src="${file.url}" controls style="max-width:100%;max-height:100%"></video></div>`;
    } else {
      body.innerHTML = `<textarea class="notepad" id="edit_${file.id}" spellcheck="false">${file.content || ''}</textarea>`;
      body.style.flex = '1';
      body.style.display = 'flex';
      const ta = body.querySelector('#edit_' + file.id);
      ta.style.flex = '1';
      ta.dataset.focused = '1';
      ta.addEventListener('input', () => {
        file.content = ta.value;
        syncSave();
      });
    }
    addToTaskbar(win, file.name, '📄');
  }

  function buildContent(app, body, win) {
    switch (app.id) {
      case 'notepad': buildNotepad(body, win); break;
      case 'calc': buildCalc(body, win); break;
      case 'computer': buildComputer(body, win); break;
      case 'explorer': buildExplorer(body, win); break;
      case 'disk': buildComputer(body, win); break;
      case 'wallpaper': buildWallpaper(body, win); break;
      case 'browser': buildGoogleXP(body, win); break;
      case 'google_pc': buildGooglePCXP(body, win); break;
      case 'firefox': buildFirefox(body, win); break;
      case 'terminal': buildTerminal(body, win); break;
      case 'gamedev': buildGameDev(body, win); break;
      case 'play': buildPlay(body, win); break;
      case 'trash': buildTrash(body, win); break;
      case 'ransom_game': startRansom(); break;
      case 'snake_game': buildSnake(body, win); break;
      default:
        if (app.custom) {
          body.innerHTML = `<div style="text-align:center;padding:20px;background:#fff"><div style="font-size:48px">${app.emoji || '📦'}</div><p>${app.name}</p></div>`;

  function buildNotepad(body, win) {
    body.style.padding = '0';
    body.style.display = 'flex';
    body.style.flexDirection = 'column';
    body.innerHTML = `<textarea class="notepad" placeholder="${currentLang === 'ru' ? 'Пиши здесь...' : 'Type here...'}" autocomplete="off"></textarea>`;
    const ta = body.querySelector('textarea');
    ta.style.flex = '1';
    ta.dataset.focused = '1';
  }

  function buildCalc(body, win) {
    body.style.padding = '0';
    body.innerHTML = `
      <div class="calc-xp">
        <div class="calc-display">0</div>
        <div class="calc-grid">
          <button>7</button><button>8</button><button>9</button><button class="op">/</button>
          <button>4</button><button>5</button><button>6</button><button class="op">*</button>
          <button>1</button><button>2</button><button>3</button><button class="op">-</button>
          <button>0</button><button>C</button><button class="eq">=</button><button class="op">+</button>
        </div>
      </div>`;
    const disp = body.querySelector('.calc-display');
    let expr = '';
    body.querySelectorAll('.calc-grid button').forEach(btn => {
      btn.onclick = () => {
        const v = btn.textContent;
        if (v === 'C') { expr = ''; disp.textContent = '0'; return; }
        if (v === '=') {
          try {
            const r = Function('"use strict";return(' + expr + ')')();
            disp.textContent = r; expr = String(r);
          } catch { disp.textContent = currentLang === 'ru' ? 'Ошибка' : 'Error'; expr = ''; }
          return;
        }
        expr += v; disp.textContent = expr;
      };
    });
  }

        const folders = [
          { name:'Documents and Settings', icon:'📁', isFolder:true },
          { name:'Program Files', icon:'📁', isFolder:true },
          { name:'WINDOWS', icon:'📁', isFolder:true },

  // ===== ЗМЕЙКА =====
  function buildSnake(body, win) {
    body.style.padding = '0';
    body.innerHTML = `
      <div style="background:#1a1a2e;padding:10px;text-align:center;color:#fff">
        <div style="font-size:14px;margin-bottom:8px">
          🐍 <b>Snake</b> — ${currentLang === 'ru' ? 'Счёт' : 'Score'}: <span id="snakeScore_${win.dataset.winId}">0</span> · ${currentLang === 'ru' ? 'Рекорд' : 'Best'}: <span id="snakeBest_${win.dataset.winId}">0</span>
        </div>
        <canvas class="snake-canvas" id="snakeCanvas_${win.dataset.winId}" width="400" height="400"></canvas>
        <div style="margin-top:10px;display:grid;grid-template-columns:repeat(3,50px);gap:4px;justify-content:center">
          <div></div>
          <button class="xp-btn snake-up" style="padding:8px">▲</button>
          <div></div>
          <button class="xp-btn snake-left" style="padding:8px">◀</button>
          <button class="xp-btn snake-down" style="padding:8px">▼</button>
          <button class="xp-btn snake-right" style="padding:8px">▶</button>
        </div>
        <div style="margin-top:10px">
          <button class="xp-btn" id="snakeRestart_${win.dataset.winId}">🔄 ${currentLang === 'ru' ? 'Заново' : 'Restart'}</button>
        </div>
      </div>`;

    const canvas = body.querySelector('#snakeCanvas_' + win.dataset.winId);
    const ctx = canvas.getContext('2d');
    const scoreEl = body.querySelector('#snakeScore_' + win.dataset.winId);
    const bestEl = body.querySelector('#snakeBest_' + win.dataset.winId);

    const gridSize = 20;
    const cellSize = canvas.width / gridSize;
    let snake = [{x:10, y:10}];
    let direction = {x:1, y:0};
    let nextDir = {x:1, y:0};
    let food = {x:15, y:15};
    let score = 0;
    let gameOver = false;
    let gameLoop = null;
    let speed = 150;

    let best = parseInt(localStorage.getItem('windows34_snake_best') || '0');
    bestEl.textContent = best;

    function spawnFood() {
      do {
        food = { x: Math.floor(Math.random()*gridSize), y: Math.floor(Math.random()*gridSize) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function draw() {
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Сетка
      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridSize; i++) {
        ctx.beginPath(); ctx.moveTo(i*cellSize, 0); ctx.lineTo(i*cellSize, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i*cellSize); ctx.lineTo(canvas.width, i*cellSize); ctx.stroke();
      }
      // Еда
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(food.x*cellSize+2, food.y*cellSize+2, cellSize-4, cellSize-4);
      // Змейка
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#4caf50' : '#2e7d32';
        ctx.fillRect(s.x*cellSize+1, s.y*cellSize+1, cellSize-2, cellSize-2);
      });
    }

    function tick() {
      if (gameOver) return;
      direction = nextDir;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true;
        if (score > best) {
          best = score;
          localStorage.setItem('windows34_snake_best', best);
          bestEl.textContent = best;
        }
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
        ctx.font = '14px monospace';
        ctx.fillText((currentLang === 'ru' ? 'Счёт: ' : 'Score: ') + score, canvas.width/2, canvas.height/2 + 10);
        ctx.fillText((currentLang === 'ru' ? 'Нажми Заново' : 'Press Restart'), canvas.width/2, canvas.height/2 + 40);
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
        if (speed > 60) {
          speed -= 3;
          clearInterval(gameLoop);
          gameLoop = setInterval(tick, speed);
        }
      } else {
        snake.pop();
      }
      draw();
    }

    function restart() {
      snake = [{x:10, y:10}];
      direction = {x:1, y:0};
      nextDir = {x:1, y:0};
      score = 0;
      speed = 150;
      scoreEl.textContent = '0';
      gameOver = false;
      spawnFood();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
      draw();
    }

    // Кнопки
    const upBtn = body.querySelector('.snake-up');
    const downBtn = body.querySelector('.snake-down');
    const leftBtn = body.querySelector('.snake-left');
    const rightBtn = body.querySelector('.snake-right');
    upBtn.onclick = (e) => { e.stopPropagation(); if (direction.y === 0) nextDir = {x:0, y:-1}; };
    downBtn.onclick = (e) => { e.stopPropagation(); if (direction.y === 0) nextDir = {x:0, y:1}; };
    leftBtn.onclick = (e) => { e.stopPropagation(); if (direction.x === 0) nextDir = {x:-1, y:0}; };
    rightBtn.onclick = (e) => { e.stopPropagation(); if (direction.x === 0) nextDir = {x:1, y:0}; };

    body.querySelector('#snakeRestart_' + win.dataset.winId).onclick = (e) => { e.stopPropagation(); restart(); };

    // Клавиатура
    const keyHandler = (e) => {
      if (!document.body.contains(canvas)) {
        window.removeEventListener('keydown', keyHandler);
        if (gameLoop) clearInterval(gameLoop);
        return;
      }
      if (e.key === 'ArrowUp' && direction.y === 0) { nextDir = {x:0, y:-1}; e.preventDefault(); }
      else if (e.key === 'ArrowDown' && direction.y === 0) { nextDir = {x:0, y:1}; e.preventDefault(); }
      else if (e.key === 'ArrowLeft' && direction.x === 0) { nextDir = {x:-1, y:0}; e.preventDefault(); }
      else if (e.key === 'ArrowRight' && direction.x === 0) { nextDir = {x:1, y:0}; e.preventDefault(); }
    };
    window.addEventListener('keydown', keyHandler);

    restart();
  }

  // ===== RANSOM =====
  let ransomActive = false;
  function startRansom() {
    if (ransomActive) return;
    ransomActive = true;

    const ASSET_PATH = 'assets/';
    const ransomAssets = {
      icon: ASSET_PATH + 'ransom.png',
      video: ASSET_PATH + 'ransom.mp4',
      coin: ASSET_PATH + 'coin.png',
      thank: ASSET_PATH + 'thank_you.mp4'
    };

    let coinsCollected = 0;
    let coinElements = [];
    const COINS_NEEDED = 50;
    const RANSOM_TIME_MS = 60000;
    let ransomTimer = null;
    let coinSpawnInterval = null;
    let videoLayer = null;

    function showFakeErrors(count, done) {
      let shown = 0;
      function next() {
        if (shown >= count) { done(); return; }
        shown++;
        const err = document.createElement('div');
        err.style.cssText = `position:absolute;width:320px;background:#ECE9D8;border:2px solid #0054E3;box-shadow:2px 2px 8px #0008;z-index:200000;left:${40 + Math.random()*Math.max(0, screen.clientWidth - 360)}px;top:${40 + Math.random()*Math.max(0, screen.clientHeight - 220)}px;font-family:Tahoma,sans-serif;`;
        const messages = [
          currentLang === 'ru' ? 'ransom.exe не может быть удалён. Система заражена.' : 'ransom.exe cannot be deleted. System infected.',
          currentLang === 'ru' ? 'КРИТИЧЕСКАЯ ОШИБКА: все файлы зашифрованы!' : 'CRITICAL ERROR: all files encrypted!',
          currentLang === 'ru' ? 'ОШИБКА 0xDEADBEEF: доступ запрещён' : 'ERROR 0xDEADBEEF: access denied',
          currentLang === 'ru' ? 'Собери 50 монет чтобы спасти компьютер!' : 'Collect 50 coins to save your computer!'
        ];
        err.innerHTML = `<div style="background:linear-gradient(180deg,#0058EE,#0048CC);color:#fff;padding:3px 8px;font-weight:bold;font-size:11px">⛔ Windows</div>
          <div style="padding:16px;font-size:12px;display:flex;gap:10px;align-items:center"><div style="font-size:32px">⚠️</div><div>${messages[shown-1]||messages[0]}</div></div>
          <div style="padding:6px;text-align:center;border-top:1px solid #808080;background:#ECE9D8"><button style="padding:3px 24px;border:1px solid #003C74;background:#ECE9D8;font-family:Tahoma;cursor:pointer;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #808080">OK</button></div>`;
        err.querySelector('button').onclick = () => { err.remove(); next(); };
        screen.appendChild(err);
      }
      next();
    }

    function openRansomVideo() {
      if (videoLayer) return;
      videoLayer = document.createElement('div');
      videoLayer.className = 'ransom-video-layer';
      const v = document.createElement('video');
      v.src = ransomAssets.video;
      v.autoplay = true; v.loop = true; v.muted = false; v.playsInline = true;
      v.onerror = () => { console.warn('ransom.mp4 не загрузилось'); };
      videoLayer.appendChild(v);
      screen.appendChild(videoLayer);
      v.play().catch(() => {});
    }

    function closeRansomVideo() {
      if (videoLayer) { videoLayer.remove(); videoLayer = null; }
    }

    function spawnCoin() {
      const c = document.createElement('div');
      c.className = 'coin';
      c.style.left = (Math.random() * (screen.clientWidth - 40)) + 'px';
      c.style.top = (Math.random() * (screen.clientHeight - 100)) + 'px';
      const img = new Image();
      img.src = ransomAssets.coin;
      img.onload = () => { c.innerHTML = ''; c.appendChild(img); };
      img.onerror = () => { c.innerHTML = '<div class="fallback">🪙</div>'; };
      c.onclick = (e) => {
        e.stopPropagation();
        c.remove();
        coinElements = coinElements.filter(x => x !== c);
        coinsCollected++;
        coinCountEl.textContent = coinsCollected;
        if (coinsCollected >= COINS_NEEDED) winRansom();
      };
      screen.appendChild(c);
      coinElements.push(c);
    }

    function startCoinGame() {
      coinCountEl.textContent = '0';
      hud.classList.add('show');
      for (let i = 0; i < 8; i++) spawnCoin();
      let tot = 8;
      coinSpawnInterval = setInterval(() => {
        if (!ransomActive) { clearInterval(coinSpawnInterval); return; }
        if (tot < COINS_NEEDED + 15) { spawnCoin(); tot++; }
        else clearInterval(coinSpawnInterval);
      }, 700);
      ransomTimer = setTimeout(() => {
        if (ransomActive && coinsCollected < COINS_NEEDED) failRansom();
      }, RANSOM_TIME_MS);
    }

    function winRansom() {
      if (!ransomActive) return;
      ransomActive = false;
      clearTimeout(ransomTimer);
      clearInterval(coinSpawnInterval);
      coinElements.forEach(c => c.remove());
      coinElements = [];
      hud.classList.remove('show');
      closeRansomVideo();
      // thank_you
      const l = document.createElement('div');
      l.className = 'thank-video-layer';
      const v = document.createElement('video');
      v.src = ransomAssets.thank;
      v.autoplay = true; v.playsInline = true;
      v.onerror = () => setTimeout(() => { l.remove(); alert('✅ ' + (currentLang === 'ru' ? 'Вирус уничтожен!' : 'Virus destroyed!')); }, 1500);
      v.onended = () => { l.remove(); alert('✅ ' + (currentLang === 'ru' ? 'Вирус уничтожен!' : 'Virus destroyed!')); };
      l.appendChild(v);
      screen.appendChild(l);
      v.play().catch(() => {});
      setTimeout(() => { if (l.parentNode) { l.remove(); alert('✅ ' + (currentLang === 'ru' ? 'Вирус уничтожен!' : 'Virus destroyed!')); } }, 5000);
      // Удаляем приложение ransom? НЕТ — оно защищено, но помечаем что игра пройдена
      // Оставляем приложение (по ТЗ его нельзя удалить)
      const ransomApp = downloadedApps.find(a => a.id === 'ransom');
      if (ransomApp) ransomApp.completed = true;
      syncSave();
      renderDesktop();
    }

    function failRansom() {
      if (!ransomActive) return;
      ransomActive = false;
      clearTimeout(ransomTimer);
      clearInterval(coinSpawnInterval);
      coinElements.forEach(c => c.remove());
      coinElements = [];
      hud.classList.remove('show');
      closeRansomVideo();
      audioShutdown.play().catch(() => {});
      const off = document.createElement('div');
      off.className = 'shutdown-screen';
      off.innerHTML = `<div class="spinner"></div><div>${currentLang === 'ru' ? 'Завершение работы...' : 'Shutting down...'}</div>`;
      screen.appendChild(off);
      setTimeout(() => off.remove(), 10000);
    }

    showFakeErrors(4, () => {
      openRansomVideo();
      startCoinGame();
    });
  }

    if (downloadedApps.some(a => a.id === 'ransom')) return;
    downloadedApps.push({

    syncSave();

  }

  function buildTrash(body, win) {
    body.style.padding = '0';
    const tr = tObj('trash');
    if (trashItems.length === 0) {
      body.innerHTML = `
        <div style="background:#fff;padding:20px;text-align:center;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-size:64px;margin-bottom:12px"><img src="assets/иконка_корзина.png" onerror="this.outerHTML='🗑️'" style="width:64px;height:64px"></div>
          <div style="font-size:14px;color:#666">${tr.empty}</div>
        </div>`;
    } else {
      body.innerHTML = `
        <div class="xp-toolbar">
          <button id="trashEmpty_${win.dataset.winId}">🗑 ${tr.clear}</button>
          <button id="trashRestore_${win.dataset.winId}">↩ ${tr.restore}</button>
        </div>
        <div style="background:#fff;height:calc(100% - 30px);padding:4px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:4px;align-content:flex-start">
          ${trashItems.map(item => `
            <div class="xp-file" data-trash-id="${item.id}">
              <div class="xf-ico">${item.icon ? `<img src="${item.icon}" onerror="this.parentNode.innerHTML='${item.fallback || '📄'}'">` : (item.fallback || '📄')}</div>
              <div>${item.name}</div>
            </div>`).join('')}
        </div>`;

      body.querySelector('#trashEmpty_' + win.dataset.winId).onclick = (e) => {
        e.stopPropagation();
        if (confirm(tr.confirmClear)) {
          trashItems.length = 0;
          syncSave();
          renderDesktop(); buildTrash(body, win);
        }
      };

      body.querySelector('#trashRestore_' + win.dataset.winId).onclick = (e) => {
        e.stopPropagation();
        trashItems.forEach(item => {
          if (item.type === 'builtin') {
            const idx = deletedIcons.indexOf(item.id);
            if (idx !== -1) deletedIcons.splice(idx, 1);
          } else if (item.type === 'file') userFiles.push(item);
          else if (item.type === 'site') sites.push(item);
          else if (item.type === 'downloaded') downloadedApps.push(item);
          else if (item.type === 'userapp') userApps.push(item);
          else if (item.type === 'installed') installedApps.push(item);
        });
        trashItems.length = 0;
        syncSave();
        renderDesktop(); buildTrash(body, win);
      };

      body.querySelectorAll('[data-trash-id]').forEach(el => {
        el.onclick = () => {
          const id = el.dataset.trashId;
          const item = trashItems.find(t => t.id === id);
          if (!item) return;
          if (confirm(`${tr.confirmRestore} «${item.name}»?`)) {
            const idx = trashItems.indexOf(item);
            trashItems.splice(idx, 1);
            if (item.type === 'builtin') {
              const di = deletedIcons.indexOf(item.id);
              if (di !== -1) deletedIcons.splice(di, 1);
            } else if (item.type === 'file') userFiles.push(item);
            else if (item.type === 'site') sites.push(item);
            else if (item.type === 'downloaded') downloadedApps.push(item);
            else if (item.type === 'userapp') userApps.push(item);
            else if (item.type === 'installed') installedApps.push(item);
            syncSave();
            renderDesktop(); buildTrash(body, win);
          }
        };
      });
    }
  }

    if (choice === '3') { createSiteDialog(); return; }
    if (choice === '2') {
      const name = prompt(d.name + ':', currentLang === 'ru' ? 'Моя программа' : 'My program');
      if (!name) return;
      const code = prompt(d.htmlCode + ':', '<h1>Hello!</h1>');
      installedApps.push({ id:'app_' + Date.now(), name, emoji:'📦', type:'html', content: code || '<h1>Empty</h1>', ext:'html' });
      syncSave();
      renderDesktop();
      alert('✅ ' + t('system.programCreated'));
      return;
    }
    const name = prompt(d.name + ':', currentLang === 'ru' ? 'Моё приложение' : 'My app');
    if (!name) return;
    const emoji = prompt(d.emoji + ':', '🚀') || '📦';
    userApps.push({ id:'user_' + Date.now(), name, emoji, custom: true });
    syncSave();
    renderDesktop();
  };

  document.addEventListener('click', (e) => {
    const link = e.target.closest('a');
    if (link && link.href) {
      if (!link.href.startsWith('javascript:') && !link.href.startsWith('#') && !link.href.startsWith('blob:')) {
        e.preventDefault();
        e.stopPropagation();
        openUrlInWindow(link.href);
      }
    }
  }, true);

  const originalOpen = window.open;
  window.open = function(url, ...args) {
    if (url) openUrlInWindow(url);
    return null;
  };

  function getMinecraftHTML() {
    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;overflow:hidden;background:#000;}</style></head><body><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}<\/script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);camera.position.set(8,15,20);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.6));const sun=new THREE.DirectionalLight(0xffffff,1.0);sun.position.set(30,50,20);scene.add(sun);
const SIZE=24,geometry=new THREE.BoxGeometry(1,1,1);
const materials={grass:new THREE.MeshLambertMaterial({color:0x4caf50}),dirt:new THREE.MeshLambertMaterial({color:0x8b5a2b}),stone:new THREE.MeshLambertMaterial({color:0x777777})};
const blocks=[],blockGrid=new Map();function key(x,y,z){return x+','+y+','+z;}
function addBlock(x,y,z,t){const c=new THREE.Mesh(geometry,materials[t]||materials.dirt);c.position.set(x,y,z);scene.add(c);blocks.push(c);blockGrid.set(key(x,y,z),c);}
for(let x=0;x<SIZE;x++)for(let z=0;z<SIZE;z++){const h=Math.floor(Math.sin(x*0.4)*2+Math.cos(z*0.4)*2+6);for(let y=0;y<=h;y++){addBlock(x,y,z,y===h?'grass':y>h-3?'dirt':'stone');}}
const player={velocity:new THREE.Vector3(),onGround:false,yaw:0,pitch:0,height:1.7};
function updateCamera(){camera.rotation.set(0,0,0);camera.rotateY(player.yaw);camera.rotateX(player.pitch);}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;});addEventListener('keyup',e=>{keys[e.code]=false;});
let pointerLocked=false;document.body.addEventListener('click',()=>{if(!pointerLocked)renderer.domElement.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===renderer.domElement;});
addEventListener('mousemove',e=>{if(pointerLocked){player.yaw-=e.movementX*0.002;player.pitch-=e.movementY*0.002;player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch));}});
function isSolid(x,y,z){return blockGrid.has(key(Math.round(x),Math.round(y),Math.round(z)));}
function collides(px,py,pz){const r=0.3;for(let dx of[-r,r])for(let dz of[-r,r])for(let dy of[0,player.height]){if(isSolid(px+dx,py+dy,pz+dz))return true;}return false;}
const GRAVITY=25,MOVE_SPEED=5,JUMP=8;let lastTime=performance.now();
function update(dt){const f=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));const r=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));const d=new THREE.Vector3();if(keys['KeyW'])d.add(f);if(keys['KeyS'])d.sub(f);if(keys['KeyD'])d.add(r);if(keys['KeyA'])d.sub(r);if(d.length()>0)d.normalize().multiplyScalar(MOVE_SPEED);const nx=camera.position.x+d.x*dt;if(!collides(nx,camera.position.y-player.height/2,camera.position.z))camera.position.x=nx;const nz=camera.position.z+d.z*dt;if(!collides(camera.position.x,camera.position.y-player.height/2,nz))camera.position.z=nz;if(keys['Space']&&player.onGround){player.velocity.y=JUMP;player.onGround=false;}player.velocity.y-=GRAVITY*dt;const ny=camera.position.y+player.velocity.y*dt;if(!collides(camera.position.x,ny-player.height/2,camera.position.z)){camera.position.y=ny;player.onGround=false;}else{if(player.velocity.y<0){camera.position.y=Math.ceil(camera.position.y-player.height/2)+player.height/2;player.onGround=true;}player.velocity.y=0;}updateCamera();}
function animate(){requestAnimationFrame(animate);const now=performance.now();const dt=Math.min((now-lastTime)/1000,0.05);lastTime=now;update(dt);renderer.render(scene,camera);}animate();
<\/script></body></html>`;
  }

    e.stopPropagation();

  function restoreWallpaper() {
    if (save.customWallpaper) {
      screen.style.backgroundImage = `url(${save.customWallpaper})`;

  setInterval(syncSave, 30000);
