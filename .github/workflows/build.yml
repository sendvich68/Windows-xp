name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Setup Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate Icons from existing icon.png
        working-directory: src-tauri
        run: |
          cargo tauri icon icons/icon.png

      - name: Init Android project if missing
        working-directory: src-tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if [ ! -d "gen/android" ]; then
            cargo tauri android init --ci
          fi

      - name: Build APK
        working-directory: src-tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo tauri android build --apk --ci

      - name: Sign APK
        run: |
          # Генерируем ключ
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass 123456 -keypass 123456 -dname "CN=Windows34, OU=Dev, O=Dev, L=City, S=State, C=US"
          
          # Ищем собранный APK
          APK=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release/ -name "*.apk" | head -n 1)
          
          # Подписываем
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks my-release-key.jks --ks-pass pass:123456 --key-pass pass:123456 --out Windows34.apk $APK

      # ВОТ ЗДЕСЬ МАГИЯ: создаем релиз и прикрепляем файл
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.3.0"
          name: "Windows 34 APK"
          body: "Автоматическая сборка APK"
          files: Windows34.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
